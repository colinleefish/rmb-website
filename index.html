<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RMB — Agent memory tool</title>
  <meta name="description" content="RMB is a multi-agent memory tool for Cursor, Claude Code, Codex, OpenCode, and Pi.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page">
    <main class="page-main">
      <section class="intro">
        <div class="intro-inner">
          <a class="brand-mark" href="/" aria-label="RMB">
            <img src="/assets/logo.svg" alt="" width="48" height="48">
          </a>
          <h1 class="product-title">
            <span class="product-title-remember" aria-label="remember, RMB"><span class="rmb-letter">R</span>e<span class="remember-sep">·</span><span class="rmb-letter">M</span>em<span class="remember-sep">·</span><span class="rmb-letter">B</span>er</span>
          </h1>
          <p class="product-tagline" data-i18n="hero.tagline">Agent memory tool</p>
          <p class="product-lead" data-i18n="hero.lead">One memory layer for all your agents.</p>

          <a class="download-primary" id="download-macos" href="https://github.com/colinleefish/rmb-desktop/releases/latest">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
            </svg>
            <span data-i18n="download.macos">Download for macOS</span>
          </a>
          <p class="download-version" id="download-version" hidden></p>

          <div class="agents-strip" aria-label="Supported agents">
            <span class="agents-strip-label" data-i18n="agents.label">Works with</span>
            <ul class="agents-strip-logos">
              <li><img src="/assets/agents/cursor.svg" alt="Cursor" title="Cursor"></li>
              <li><img src="/assets/agents/claude-code.svg" alt="CC" title="Claude Code"></li>
              <li><img src="/assets/agents/codex.svg" alt="Codex" title="Codex"></li>
              <li><img src="/assets/agents/opencode.svg" alt="OpenCode" title="OpenCode"></li>
              <li><img src="/assets/agents/pi.png" alt="Pi" title="Pi"></li>
            </ul>
          </div>
        </div>

        <footer class="page-footer">
          <div class="footer-actions">
            <a
              class="footer-github"
              href="https://github.com/colinleefish/rmb-desktop"
              target="_blank"
              rel="noopener"
              aria-label="GitHub"
            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
              </svg>
            </a>
            <div class="lang-picker" id="lang-picker">
              <button
                type="button"
                class="lang-picker-trigger"
                id="lang-toggle"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-controls="lang-picker-menu"
                data-i18n-aria="footer.langPicker"
              >
                <svg class="lang-picker-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="10"/>
                  <path d="M2 12h20"/>
                  <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
                <span class="lang-picker-label" id="lang-picker-label">English</span>
              </button>
              <ul class="lang-picker-menu" id="lang-picker-menu" role="listbox" hidden>
                <li role="presentation">
                  <button type="button" class="lang-picker-option" role="option" data-lang="en" aria-selected="true">
                    <span>English</span>
                    <svg class="lang-picker-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M20 6 9 17l-5-5"/>
                    </svg>
                  </button>
                </li>
                <li role="presentation">
                  <button type="button" class="lang-picker-option" role="option" data-lang="zh" aria-selected="false">
                    <span>简体中文</span>
                    <svg class="lang-picker-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M20 6 9 17l-5-5"/>
                    </svg>
                  </button>
                </li>
              </ul>
            </div>
          </div>
          <p class="footer-copy">© 2026 re-mem-ber.me</p>
        </footer>
      </section>

      <section class="showcase" aria-hidden="true"></section>
    </main>
  </div>

  <script src="i18n.js"></script>
  <script src="main.js"></script>
</body>
</html>
